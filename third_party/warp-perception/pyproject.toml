[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warp-perception"
version = "0.1.0"
description = "Fused GPU-native depth + occupancy-grid ray-casting sensor implemented as NVIDIA Warp kernels for vectorized RL environments."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "warp-perception contributors" }]
keywords = ["raycasting", "occupancy", "depth", "warp", "reinforcement-learning", "isaaclab", "gpu"]

# These are expected to already be provided by the target (IsaacLab) environment.
# Loose specifiers avoid pip replacing the CUDA-enabled torch / local Warp build.
dependencies = [
    "warp-lang>=1.0",
    "torch>=2.0",
]

[project.optional-dependencies]
test = ["numpy>=1.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
warp_perception = ["py.typed"]
